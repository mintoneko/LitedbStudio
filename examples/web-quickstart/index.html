<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiteDB 前端极速接入示例</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #111827;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #0284c7;
      --border: #1e293b;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); padding: 40px 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 640px; }
    .header { margin-bottom: 24px; text-align: center; }
    .header h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 6px; }
    .header p { color: var(--muted); font-size: 0.85rem; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .form-row { display: flex; gap: 10px; margin-bottom: 20px; }
    input[type="text"] { flex: 1; background: #070a12; border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; color: #fff; font-size: 0.9rem; outline: none; }
    input[type="text"]:focus { border-color: var(--primary); }
    button { background: var(--primary); color: #fff; border: none; border-radius: 8px; padding: 10px 16px; font-weight: 600; font-size: 0.9rem; cursor: pointer; transition: 0.15s; }
    button:hover { opacity: 0.9; }
    .filters { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; font-size: 0.8rem; color: var(--muted); }
    .filter-tabs { display: flex; gap: 6px; }
    .filter-tab { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 4px 10px; font-size: 0.75rem; border-radius: 6px; }
    .filter-tab.active { background: rgba(2, 132, 199, 0.2); border-color: var(--primary); color: #38bdf8; }
    .todo-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .todo-item { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.02); border: 1px solid var(--border); padding: 12px 16px; border-radius: 8px; }
    .todo-item.done .todo-text { text-decoration: line-through; color: var(--muted); }
    .todo-left { display: flex; align-items: center; gap: 12px; }
    .todo-checkbox { width: 18px; height: 18px; cursor: pointer; accent-color: var(--success); }
    .btn-del { background: transparent; color: #ef4444; padding: 4px 8px; font-size: 0.75rem; border-radius: 4px; }
    .btn-del:hover { background: rgba(239, 68, 68, 0.15); }
    .stats { margin-top: 20px; font-size: 0.8rem; color: var(--muted); text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>⚡ LiteDB 前端集成 Demo</h1>
      <p>这是一个调用 LiteDB REST API / SDK 的轻量前端应用</p>
    </div>

    <div class="card">
      <div class="form-row">
        <input type="text" id="todo-input" placeholder="输入任务名称，按回车添加...">
        <button id="btn-add">添加任务</button>
      </div>

      <div class="filters">
        <div class="filter-tabs">
          <button class="filter-tab active" data-filter="all">全部</button>
          <button class="filter-tab" data-filter="active">未完成</button>
          <button class="filter-tab" data-filter="completed">已完成</button>
        </div>
        <span id="todo-count">0 个任务</span>
      </div>

      <ul class="todo-list" id="todo-list">
        <li style="text-align:center; padding: 20px; color: var(--muted);">加载中...</li>
      </ul>

      <div class="stats" id="db-status">连接 LiteDB 服务中...</div>
    </div>
  </div>

  <script type="module">
    // 直接使用 Fetch 或通过 SDK 调用 LiteDB 服务端
    const LITEDB_URL = 'http://localhost:3000';
    let currentFilter = 'all';

    async function fetchTodos() {
      const filter = {};
      if (currentFilter === 'active') filter.completed = false;
      if (currentFilter === 'completed') filter.completed = true;

      try {
        const res = await fetch(`${LITEDB_URL}/api/collections/todos/query`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ filter, sort: { created_at: -1 } })
        });
        const json = await res.json();
        renderList(json.data || []);
        document.getElementById('db-status').textContent = '✅ 已连接 LiteDB 服务';
      } catch (err) {
        document.getElementById('db-status').textContent = '❌ 连接失败，请确保 LiteDB 服务已启动';
      }
    }

    function renderList(items) {
      const list = document.getElementById('todo-list');
      document.getElementById('todo-count').textContent = `${items.length} 个任务`;

      if (items.length === 0) {
        list.innerHTML = '<li style="text-align:center; padding: 20px; color: var(--muted); font-size: 0.85rem;">暂无任何任务</li>';
        return;
      }

      list.innerHTML = items.map(item => `
        <li class="todo-item ${item.completed ? 'done' : ''}">
          <div class="todo-left">
            <input type="checkbox" class="todo-checkbox" ${item.completed ? 'checked' : ''} onchange="toggleTodo('${item.id}', ${!item.completed})">
            <span class="todo-text">${escapeHtml(item.title)}</span>
          </div>
          <button class="btn-del" onclick="deleteTodo('${item.id}')">删除</button>
        </li>
      `).join('');
    }

    window.toggleTodo = async (id, completed) => {
      await fetch(`${LITEDB_URL}/api/collections/todos/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ completed })
      });
      fetchTodos();
    };

    window.deleteTodo = async (id) => {
      await fetch(`${LITEDB_URL}/api/collections/todos/${id}`, { method: 'DELETE' });
      fetchTodos();
    };

    async function addTodo() {
      const input = document.getElementById('todo-input');
      const title = input.value.trim();
      if (!title) return;

      await fetch(`${LITEDB_URL}/api/collections/todos/insert`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, completed: false })
      });

      input.value = '';
      fetchTodos();
    }

    document.getElementById('btn-add').addEventListener('click', addTodo);
    document.getElementById('todo-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addTodo();
    });

    document.querySelectorAll('.filter-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentFilter = tab.getAttribute('data-filter');
        fetchTodos();
      });
    });

    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    fetchTodos();
  </script>
</body>
</html>
